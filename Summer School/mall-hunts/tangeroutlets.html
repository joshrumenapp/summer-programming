<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tanger Outlet Explorer Hunt</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #d1d5db;
      --accent: #2563eb;
      --accent-dark: #1d4ed8;
      --danger: #b91c1c;
      --success: #166534;
      --gold-bg: #fef3c7;
      --silver-bg: #f3f4f6;
      --bronze-bg: #ffedd5;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.4;
    }

.direction-button {
  display: block;
  min-height: 46px;
  border-radius: 12px;
  background: #2563eb;
  color: white;
  font-weight: bold;
  font-size: 1rem;
  padding: 10px 12px;
  text-align: center;
  text-decoration: none;
}

    header {
      background: var(--card);
      padding: 18px 16px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 1.45rem;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 16px;
    }

    .card, .top-controls, .student-info, .level-card, .summary-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.04);
    }

    .top-controls {
      display: grid;
      gap: 10px;
    }

    .button-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    button, .back-link {
      min-height: 46px;
      border: none;
      border-radius: 12px;
      background: var(--accent);
      color: white;
      font-weight: bold;
      font-size: 1rem;
      padding: 10px 12px;
      text-align: center;
      text-decoration: none;
      display: block;
    }

    button.secondary, .back-link.secondary {
      background: #374151;
    }

    button.danger {
      background: var(--danger);
    }

    label {
      display: block;
      font-weight: bold;
      margin: 12px 0 5px;
    }

    input, textarea, select {
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      font-size: 1rem;
      background: white;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .section-title {
      font-size: 1.25rem;
      margin: 0 0 8px;
    }

    .level-card.scout { background: var(--bronze-bg); }
    .level-card.explorer { background: var(--silver-bg); }
    .level-card.adventuerer { background: var(--gold-bg); }

    .level-card h2 {
      margin: 0 0 8px;
      font-size: 1.2rem;
    }

    .level-card p, .card p {
      color: var(--muted);
      margin-top: 0;
    }

    .task {
      padding: 12px 0;
      border-top: 1px solid var(--border);
    }

    .task-label {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin: 0;
      font-size: 1.05rem;
    }

    .task-label input {
      width: 24px;
      min-height: 24px;
      margin-top: 1px;
      flex-shrink: 0;
    }

    .response-box {
      margin-top: 8px;
      padding-left: 34px;
    }

    .response-box label {
      margin-top: 0;
      font-weight: normal;
      color: var(--muted);
    }

    .summary-card {
      border: 2px solid var(--accent);
    }

    .summary-line {
      font-size: 1.15rem;
      font-weight: bold;
      margin: 8px 0;
    }

    .earned {
      color: var(--success);
      font-size: 1.25rem;
    }

    .completion-grid {
      display: grid;
      gap: 8px;
      margin-top: 10px;
    }

    .completion-grid label {
      display: flex;
      gap: 10px;
      align-items: center;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      margin: 0;
      background: white;
    }

    .completion-grid input {
      width: 24px;
      min-height: 24px;
    }


    .complete-button {
      background: var(--success);
    }

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      z-index: 100;
      padding: 16px;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.show {
      display: flex;
    }

    .celebration-modal {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 18px;
      padding: 22px;
      text-align: center;
      box-shadow: 0 12px 32px rgba(0,0,0,0.25);
      border: 3px solid var(--accent);
    }

    .celebration-modal h2 {
      margin: 0 0 10px;
      font-size: 1.8rem;
    }

    .celebration-modal p {
      font-size: 1.1rem;
      color: var(--text);
      margin: 8px 0;
    }

    .celebration-level {
      font-size: 1.35rem;
      font-weight: bold;
      color: var(--success);
      margin: 14px 0;
    }

    .modal-actions {
      display: grid;
      gap: 10px;
      margin-top: 18px;
    }

    footer {
      padding: 24px 16px 48px;
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
    }

    @media print {
      header, .top-controls, footer, .back-link { display: none; }
      body { background: white; }
      main { max-width: none; padding: 0; }
      .card, .student-info, .level-card, .summary-card { box-shadow: none; page-break-inside: avoid; }
    }
  </style>
</head>

<body>
  <header>
    <h1>Tanger Outlets Explorer Hunt</h1>
    <p class="subtitle">A kid-friendly community navigation, safety, and discovery activity.</p>
  </header>

<section class="card">
    <h2 class="section-title">Location Information</h2>

    <p>
      Tanger Outlets<br>
      350 284th St SW<br>
      Byron Center, MI 49315
    </p>

    <a class="direction-button"
       href="https://www.google.com/maps/search/?api=1&query=350+84th+St+SW+ByronCenter+MI+49315"
       target="_blank">
       Directions
    </a>
</section>
